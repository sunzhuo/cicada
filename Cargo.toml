[package]
name = "zero-daemon"
version = "0.2.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
serde_json = "1.0"
tao = "0.30"
tray-icon = "0.19"
muda = "0.15"
parking_lot_core = "=0.9.10"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
